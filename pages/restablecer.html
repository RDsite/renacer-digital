
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña | RDCA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #302449;
            background: linear-gradient(
                125deg,
                #dcffed,
                #e9ddff,
                #dcefff,
                #ffe6f3,
                #d8fff1
            );
            background-size: 400% 400%;
            animation: fondoRDCA 20s ease infinite;
        }

        @keyframes fondoRDCA {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .auth-header {
            padding: 25px 7%;
        }

        .auth-header a {
            text-decoration: none;
            color: #7040c8;
            font-weight: 800;
        }

        .reset-container {
            width: min(440px, 92%);
            margin: 8vh auto;
            padding: 38px;
            border-radius: 25px;
            background: rgba(255,255,255,.85);
            border: 1px solid white;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(80,55,135,.15);
        }

        .reset-icon {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            margin: 0 auto 25px;
            border-radius: 20px;
            background: linear-gradient(135deg,#16b985,#8247e5);
            color: white;
            font-size: 28px;
        }

        h1 {
            text-align: center;
            font-size: 29px;
            margin-bottom: 12px;
        }

        .reset-description {
            color: #81788f;
            text-align: center;
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1.5px solid #e4ddec;
            border-radius: 13px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #9863ee;
            box-shadow: 0 0 0 4px rgba(142,91,232,.1);
        }

        .reset-button {
            width: 100%;
            min-height: 54px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(115deg,#7540dd,#16b985);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .3s;
        }

        .reset-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(119,62,218,.25);
        }

        .reset-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .reset-message {
            display: none;
            padding: 14px;
            margin: 18px 0;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .reset-message.success {
            display: block;
            background: #ecfdf3;
            color: #137a48;
        }

        .reset-message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        .reset-back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #7540d3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
        }

        @media(max-width:500px) {
            .reset-container {
                padding: 30px 23px;
            }
        }

        @media(prefers-reduced-motion:reduce) {
            body {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <header class="auth-header">
        <a href="../index.html">✦ RDCA Renacer Digital</a>
    </header>

    <main class="reset-container">

        <div class="reset-icon">🔒</div>

        <h1>Crear nueva contraseña</h1>

        <p class="reset-description">
            Ingresa una nueva contraseña para recuperar
            el acceso a tu espacio personal de RDCA.
        </p>

        <form id="resetForm">

            <div class="form-group">
                <label for="newPassword">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit"
                    class="reset-button"
                    id="resetButton">
                Guardar nueva contraseña →
            </button>

            <p id="resetMessage"
               class="reset-message"
               role="status"
               aria-live="polite"></p>

        </form>

        <a href="login.html" class="reset-back">
            ← Volver a iniciar sesión
        </a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/restablecer.js"></script>

</body>
</html>
